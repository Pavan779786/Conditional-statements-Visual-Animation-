<script>
const $=s=>document.querySelector(s);
const hl=c=>c.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/(#.*)|("[^"]*")|\b(if|elif|else|and|or|not|True|False|print)\b|\b(\d+)\b/g,(m,a,b,c2,d)=>a?`<span class=c>${m}</span>`:b?`<span class=s>${m}</span>`:c2?`<span class=k>${m}</span>`:`<span class=n>${m}</span>`);
const pre=c=>`<pre>${hl(c)}</pre>`;
// theme
let dark=matchMedia("(prefers-color-scheme:dark)").matches;
function setT(){document.documentElement.dataset.theme=dark?"dark":"light"}setT();
$("#th").onclick=()=>{dark=!dark;setT()};
// sections data
const S={
intro:{n:"Start Here",h:"What are Conditional Statements?",say:["Imagine your teacher says: <b>“If it rains, take an umbrella.”</b> You first <b>check</b> something (is it raining?). Then you <b>decide</b> what to do. Python does exactly the same, using the word <b>if</b>.","<b>Why do we need them?</b> Without decisions, a program does the same thing every time. With decisions, it can say “Pass” or “Fail”, allow or block a login, give cash or refuse.","<b>How does Python decide?</b> It asks a question that has only two answers: <b>True</b> or <b>False</b>. True means “do this”. False means “skip this” or “do something else”. Press the button below and watch it happen."],vars:[["raining","b",true,"Is it raining?"]],tree:{q:"raining == True",f:v=>v.raining,y:"Take an umbrella 🌂",n:"Walk without umbrella 😎"},cards:1},
if:{n:"if",h:"The if Statement",say:["Think of a classroom rule: <b>if</b> the bell rings, we go home. Python checks <b>one</b> question. If the answer is <b>True</b>, it runs the work. If <b>False</b>, it skips the work and moves on.","The line after <b>if</b> is pushed to the right. This space is called <b>indentation</b>. It tells Python: “this line belongs to the if”."],syn:"if condition:\n    statement",ex:'age = 20\n\nif age >= 18:\n    print("Eligible to vote")',lines:["<b>age = 20</b> – store the number 20 in a box named age.","<b>if age >= 18:</b> – ask: is age greater than or equal to 18? The colon <b>:</b> is compulsory.","<b>print(...)</b> – indented, so it runs only when the answer is True."],vars:[["age","n",20,"age"]],tree:{q:"age >= 18",f:v=>v.age>=18,y:'print("Eligible to vote")',n:"Nothing happens"}},
ifelse:{n:"if-else",h:"The if-else Statement",say:["With plain <b>if</b>, nothing happens when the answer is False. We use <b>else</b> as the “otherwise” plan: <b>if</b> the condition is True do this, <b>else</b> do that.","Exactly <b>one</b> of the two blocks always runs. Never both, never none."],syn:"if condition:\n    statement\nelse:\n    statement",ex:'number = 10\n\nif number > 0:\n    print("Positive Number")\nelse:\n    print("Not a Positive Number")',lines:["<b>else:</b> has no condition. It needs a colon and its own indented line.","Line up <b>else</b> exactly under its <b>if</b>."],vars:[["number","n",10,"number"]],tree:{q:"number > 0",f:v=>v.number>0,y:'print("Positive Number")',n:'print("Not a Positive Number")'}},
elif:{n:"if-elif-else",h:"The if-elif-else Statement",say:["Sometimes there are <b>more than two</b> choices, like grades. <b>elif</b> means “else, if this is true”. Python checks <b>from top to bottom</b>.","The moment one condition is True, Python runs that block and <b>ignores everything below</b>. Only the first match runs."],syn:"if condition1:\n    statement1\nelif condition2:\n    statement2\nelif condition3:\n    statement3\nelse:\n    default_statement",ex:'marks = 75\n\nif marks >= 90:\n    print("Grade A")\nelif marks >= 75:\n    print("Grade B")\nelif marks >= 50:\n    print("Grade C")\nelse:\n    print("Fail")',lines:["Try marks = 95. It matches the first check, so the others are never even looked at.","Order matters! Put the biggest check first."],vars:[["marks","n",75,"marks"]],tree:{q:"marks >= 90",f:v=>v.marks>=90,y:'print("Grade A")',n:{q:"marks >= 75",f:v=>v.marks>=75,y:'print("Grade B")',n:{q:"marks >= 50",f:v=>v.marks>=50,y:'print("Grade C")',n:'print("Fail")'}}}},
nested:{n:"Nested if",h:"The Nested if Statement",say:["<b>Nested</b> means one thing inside another, like a small box inside a big box. A nested if is an <b>if inside an if</b>.","Real example: to enter a club, you must first be 18 or above. <b>Only then</b> the guard checks your ID."],syn:"if condition1:\n    if condition2:\n        statement\n    else:\n        statement\nelse:\n    statement",ex:'age = 20\nhas_id = True\n\nif age >= 18:\n    if has_id:\n        print("Entry Allowed")\n    else:\n        print("ID Required")\nelse:\n    print("Not Eligible")',lines:["Each level moves <b>4 spaces</b> to the right. Inner lines belong to the nearest if above them.","Execution order: outer check first. The inner check runs only if the outer one is True."],vars:[["age","n",20,"age"],["has_id","b",true,"has_id"]],tree:{q:"age >= 18",f:v=>v.age>=18,y:{q:"has_id",f:v=>v.has_id,y:'"Entry Allowed"',n:'"ID Required"'},n:'"Not Eligible"'}}};
let cnt=0;
function rtree(t,id){if(typeof t=="string")return`<div class="nd" id="${id}">${t.replace(/</g,"&lt;")}</div>`;
const c=(x,b)=>`<div class="bb ${typeof x=="string"?"":"big"}"><div class="lbl ${b=="y"?"t":"f"}" id="${id+b}">${b=="y"?"TRUE":"FALSE"}</div><div class="arr"></div>${rtree(x,id+b+"c")}</div>`;
return`<div class="nd dec" id="${id}">◆ ${t.q}</div><div class="br">${c(t.y,"y")}${c(t.n,"n")}</div>`}
function walk(t,v,id,p){if(typeof t=="string"){p.push(id);return t}p.push(id);const r=t.f(v),b=r?"y":"n";p.push(id+b);return walk(r?t.y:t.n,v,id+b+"c",p)}
function flow(k){const s=S[k];return`<div class="fl" id="fl"><div class="nd st" id="start">START</div><div class="arr"></div>${rtree(s.tree,"r")}<div class="arr"></div><div class="nd st" id="end">END</div></div>`}
function inputs(k){return S[k].vars.map(([n,t,d,l])=>t=="n"?`<label>${l} = <input id="v_${n}" type="number" value="${d}" style="width:100px"></label>`:`<label>${l} = <select id="v_${n}"><option value="true"${d?" selected":""}>True</option><option value="false"${d?"":" selected"}>False</option></select></label>`).join("")}
function play(k){const s=S[k],v={};s.vars.forEach(([n,t])=>{const e=$("#v_"+n);v[n]=t=="n"?Number(e.value):e.value=="true"});
document.querySelectorAll("#fl .on").forEach(e=>e.classList.remove("on"));const p=["start"];const out=walk(s.tree,v,"r",p);p.push("end");
const fl=$("#fl");let dt=$("#dot");if(!dt){dt=document.createElement("div");dt.id="dot";fl.appendChild(dt)}p.forEach((id,i)=>setTimeout(()=>{const e=$("#"+id);if(!e)return;e.classList.add("on");const a=e.getBoundingClientRect(),b=fl.getBoundingClientRect();dt.style.transform=`translate(${a.left-b.left+a.width/2}px,${a.top-b.top+a.height/2}px)`},i*450));
setTimeout(()=>{$("#res").innerHTML="✅ Python follows the highlighted path and gives: <b>"+out.replace(/</g,"&lt;")+"</b>";boom()},p.length*450)}
function sec(k){const s=S[k];let h=`<h2>${s.h}</h2><div class=card>${s.say.map(x=>`<p>${x}</p>`).join("")}</div>`;
if(s.syn)h+=`<div class="g2"><div class=card><h3>Syntax</h3>${pre(s.syn)}<h3>Example</h3>${pre(s.ex)}</div><div class=card><h3>Line by line</h3>${s.lines.map(x=>`<p>👉 ${x}</p>`).join("")}</div></div>`;
h+=`<div class=card><h3>Watch the decision</h3><div class=row>${inputs(k)}<button class=b onclick="play('${k}')">▶ Run the flowchart</button></div>${flow(k)}<div class=res id=res>Change the value, press Run, and watch the path light up.</div></div>`;
if(s.cards)h+=`<h3>Real-life decisions (tap to flip the answer)</h3><div class=g2>${[["☔ If it rains, take an umbrella","It is raining","Take an umbrella 🌂","No umbrella needed 😎"],["📝 If marks ≥ 35, pass; otherwise fail","Marks = 60","Pass ✅","Fail ❌"],["🗳️ If age ≥ 18, eligible to vote","Age = 20","Eligible to vote ✅","Not eligible yet ⏳"]].map((c,i)=>`<div class=card><b>${c[0]}</b><br><button class="b alt" onclick="fl2(this,${i})">Condition: ${c[1]} → TRUE</button><div class=res>${c[2]}</div></div>`).join("")}</div>`;
return h}
const C3=[["It is raining","Marks = 60","Age = 20"],["It is not raining","Marks = 20","Age = 15"]];
function fl2(b,i){const t=b.dataset.f!="1";b.dataset.f=t?"1":"";const d=[["Take an umbrella 🌂","No umbrella needed 😎"],["Pass ✅","Fail ❌"],["Eligible to vote ✅","Not eligible yet ⏳"]][i];b.textContent="Condition: "+C3[t?1:0][i]+(t?" → FALSE":" → TRUE");b.nextElementSibling.textContent=d[t?1:0]}
// compare
function cmp(){const r=[["if","1","Do something only when a condition is True. Otherwise skip.","Check → True: run → End. False: End","If it rains, take an umbrella."],["if-else","1 (two outcomes)","Exactly two choices. One always runs.","Check → True block, or False block","Pass or fail."],["if-elif-else","2 or more","Many choices; first match wins.","Check top to bottom, stop at first True","Grade A, B, C or Fail."],["nested if","2 or more (one inside another)","A second question only matters after the first is True.","Outer check → inner check","Age 18+ first, then ID check."]];
return`<h2>Side-by-Side Comparison</h2><div class="card tbl"><table><tr><th>Type</th><th>Conditions</th><th>When to use</th><th>Execution flow</th><th>Real-world example</th></tr>${r.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join("")}</table></div>`}
// mini python simulator (JavaScript based)
function py(src){const L=[];src.split("\n").forEach((l,i)=>{const t=l.trim();if(t&&t[0]!="#")L.push({i:l.match(/^ */)[0].length,t,n:i})});
const V={},out=[],st=[],hit=[];
const ex=e=>{const parts=e.split(/("[^"]*"|'[^']*')/);if(parts.some((x,j)=>j%2==0&&(!/^[\w\s<>=!&|+\-*\/%().,]*$/.test(x)||/\.(?!\d)|\/\//.test(x))))throw Error("This simulator can’t understand: "+e);
const j=parts.map((x,i)=>i%2?x:x.replace(/\bTrue\b/g,"true").replace(/\bFalse\b/g,"false").replace(/\band\b/g,"&&").replace(/\bor\b/g,"||").replace(/\bnot\b/g,"!")).join("");
return Function(...Object.keys(V),'"use strict";return('+j+")")(...Object.values(V))};
const fm=x=>x===true?"True":x===false?"False":x;
function run(a,b){let i=a;while(i<b){const l=L[i];
if(/^if\s/.test(l.t)){const br=[];let j=i;while(j<b&&L[j].i===l.i&&(j==i||/^(elif\s|else\s*:)/.test(L[j].t))){let k=j+1;while(k<b&&L[k].i>l.i)k++;br.push([j,k]);j=k}
for(const[s,e]of br){const t=L[s].t;if(/^else/.test(t)){st.push("Line "+(L[s].n+1)+": else → no earlier condition was True, so this block runs");hit.push(L[s].n);run(s+1,e);break}
const c=t.replace(/^(if|elif)\s+/,"").replace(/:$/,"");if(/(^|[^=!<>])=(?!=)/.test(c))throw Error("Line "+(L[s].n+1)+": use == to compare, a single = stores a value");
const r=ex(c);st.push("Line "+(L[s].n+1)+": "+t+" → "+fm(r)+(r?" ✔ run this block, skip the rest":" ✘ skip this block"));if(r){hit.push(L[s].n);run(s+1,e);break}}i=j}
else if(/^print\(.*\)$/.test(l.t)){out.push(ex("["+l.t.slice(6,-1)+"]").map(fm).join(" "));st.push("Line "+(l.n+1)+": print → shows output");i++}
else{const m=l.t.match(/^(\w+)\s*=\s*(.+)$/);if(!m||/^(\w+)\s*==/.test(l.t))throw Error("Line "+(l.n+1)+": can’t understand “"+l.t+"”");V[m[1]]=ex(m[2]);st.push("Line "+(l.n+1)+": "+m[1]+" now stores "+fm(V[m[1]]));i++}}}
run(0,L.length);return{out,st,hit}}
const PG='age = 20\nhas_id = True\n\nif age >= 18:\n    if has_id:\n        print("Entry Allowed")\n    else:\n        print("ID Required")\nelse:\n    print("Not Eligible")';
function play2(){return`<h2>Code Playground</h2><div class=card><p>Edit the code, then press Run. This is a <b>JavaScript simulation</b> of simple Python (variables, print, if/elif/else, comparisons, and/or/not). It is <b>not real Python</b>, and input() is not supported.</p><textarea class=code id=pg spellcheck=false>${PG}</textarea><div><button class=b onclick=runPg()>▶ Run</button><button class="b alt" onclick="$('#pg').value=PG;$('#po').textContent='';$('#ps').innerHTML='';$('#pc').innerHTML=''">↺ Reset</button></div><h3>Output console</h3><div class=con id=po>Press Run to see the output.</div><h3>Executed conditions</h3><div id=pc></div><h3>Step-by-step</h3><div id=ps></div></div>`}
function runPg(){const src=$("#pg").value;try{const r=py(src);$("#po").textContent=r.out.join("\n")||"(no output)";$("#ps").innerHTML=r.st.map(x=>`<p>• ${x.replace(/</g,"&lt;")}</p>`).join("");
$("#pc").innerHTML="<pre>"+src.split("\n").map((l,i)=>`<span class="${r.hit.includes(i)?"hx":"hl"}">${hl(l)||" "}</span>`).join("")+"</pre>"}catch(e){$("#po").textContent="⚠ "+e.message;$("#ps").innerHTML="";$("#pc").innerHTML=""}}
// simulators
const SIM=[
{t:"🗳️ Voting Eligibility",in:[["age","Age","number",17]],code:['if age >= 18:','    print("Eligible to vote")','else:','    print("Not eligible yet")'],f:v=>v.age>=18?["Eligible to vote ✅",[0,1],1]:["Not eligible yet ❌",[2,3],0]},
{t:"📝 Marks and Grade",in:[["marks","Marks","number",82]],code:['if marks >= 90:','    print("Grade A")','elif marks >= 75:','    print("Grade B")','elif marks >= 50:','    print("Grade C")','else:','    print("Fail")'],f:v=>v.marks>=90?["Grade A 🌟",[0,1],1]:v.marks>=75?["Grade B 👍",[2,3],1]:v.marks>=50?["Grade C 🙂",[4,5],1]:["Fail 📚",[6,7],0]},
{t:"🏧 ATM Withdrawal",in:[["balance","Balance","number",5000],["amount","Amount","number",2000]],code:['if amount <= 0:','    print("Enter a valid amount")','elif amount <= balance:','    print("Take your cash")','else:','    print("Insufficient balance")'],f:v=>v.amount<=0?["Enter a valid amount ⚠️",[0,1],0]:v.amount<=v.balance?["Take your cash 💵 (new balance "+(v.balance-v.amount)+")",[2,3],1]:["Insufficient balance ❌",[4,5],0]},
{t:"🔐 Login System",in:[["user","Username","text","admin"],["pw","Password","text","1234"]],code:['if username == "admin":','    if password == "1234":','        print("Login successful")','    else:','        print("Wrong password")','else:','    print("User not found")'],f:v=>v.user=="admin"?v.pw=="1234"?["Login successful ✅",[0,1,2],1]:["Wrong password ❌",[0,1,3,4],0]:["User not found ❌",[5,6],0]}];
function sims(){return`<h2>Condition Simulator</h2><p>Type values, press the button, and see which lines of code ran (highlighted in yellow).</p><div class=g2>${SIM.map((s,i)=>`<div class=card><h3>${s.t}</h3><div class=row>${s.in.map(a=>`<label>${a[1]} <input id="s${i}${a[0]}" type="${a[2]}" value="${a[3]}" style="width:120px"></label>`).join("")}</div><button class=b onclick=sim(${i})>Check</button><div id=sc${i}>${pre(s.code.join("\n"))}</div><div class=res id=sr${i}>Press Check.</div></div>`).join("")}</div>`}
function sim(i){const s=SIM[i],v={};s.in.forEach(a=>{const e=$("#s"+i+a[0]);v[a[0]]=a[2]=="number"?Number(e.value):e.value});const[o,h,g]=s.f(v);
$("#sc"+i).innerHTML="<pre>"+s.code.map((l,j)=>`<span class="${h.includes(j)?"hx":"hl"}">${hl(l)}</span>`).join("")+"</pre>";const r=$("#sr"+i);r.textContent=o;r.className="res "+(g?"ok":"bad");if(g)boom()}
// practice
const Q=[["Beginner",["Which keyword starts a decision in Python?","",["if","when","check"],0,"Every decision starts with the word if."]],
["Beginner",["What must come at the end of an if line?","",[": (colon)","; (semicolon)",". (dot)"],0,"The colon tells Python that a block of code follows."]],
["Beginner",["The condition is False and there is no else. What happens?","",["The block is skipped","An error appears","The program stops"],0,"Python simply skips the block and carries on."]],
["Beginner",["How does Python know which lines are inside the if?","",["Indentation (spaces)","Capital letters","Curly brackets { }"],0,"Lines pushed to the right belong to the if."]],
["Intermediate",["What is printed?","marks = 75\nif marks >= 90:\n    print(\"A\")\nelif marks >= 75:\n    print(\"B\")\nelse:\n    print(\"C\")",["A","B","C"],1,"75 is not ≥ 90, but it is ≥ 75, so B runs."]],
["Intermediate",["In an if-elif-else chain, how many blocks run?","",["Only the first matching one","All matching ones","All of them"],0,"Python stops at the first True condition."]],
["Intermediate",["What is printed?","age = 17\nhas_id = True\nif age >= 18:\n    if has_id:\n        print(\"Entry Allowed\")\n    else:\n        print(\"ID Required\")\nelse:\n    print(\"Not Eligible\")",["Entry Allowed","ID Required","Not Eligible"],2,"The outer check fails (17 is not ≥ 18), so the inner check never runs."]],
["Intermediate",["Value of the condition?","x = 5\nx > 3 and x < 5",["True","False","Error"],1,"x < 5 is False, and “and” needs both parts True."]],
["Output prediction",["What is printed?","n = 0\nif n > 0:\n    print(\"Pos\")\nelif n < 0:\n    print(\"Neg\")\nelse:\n    print(\"Zero\")",["Pos","Neg","Zero"],2,"0 is neither above nor below 0, so else runs."]],
["Output prediction",["What is printed?","x = 10\nif x > 5:\n    print(\"A\")\nif x > 8:\n    print(\"B\")",["A only","B only","A then B"],2,"These are two separate ifs, so both are checked and both run."]],
["Find the error",["What is wrong?","if age >= 18\n    print(\"Adult\")",["Missing colon after the condition","print is wrong","Nothing is wrong"],0,"Every if line must end with a colon."]],
["Find the error",["What is wrong?","if x = 5:\n    print(\"Five\")",["Should be == to compare","Should be elif","Nothing is wrong"],0,"= stores a value. == compares two values."]]];
const CH=[["Coding challenge 1","Print Even if num is even, otherwise Odd.","num = 7\n# write your if-else below\n","Odd"],["Coding challenge 2","Print Hot if temp is above 30, otherwise Cool.","temp = 35\n# write your if-else below\n","Hot"]];
let sc=0,done=0;
function prac(){sc=0;done=0;let last="";return`<h2>Practice and Knowledge Check</h2><div class=res id=score>Score: 0 / ${Q.length}</div>`+Q.map((q,i)=>{let h="";if(q[0]!=last){h=`<h3>${q[0]}</h3>`;last=q[0]}const d=q[1];return h+`<div class=card id="q${i}"><b>${d[0]}</b>${d[1]?pre(d[1]):""}${d[2].map((o,j)=>`<button class=opt onclick="ans(${i},${j})">${o}</button>`).join("")}<div class=why></div></div>`}).join("")+`<h3>Coding challenges</h3>`+CH.map((c,i)=>`<div class=card><b>${c[0]}</b><p>${c[1]}</p><textarea class=code style="height:110px" id="ch${i}" spellcheck=false>${c[2]}</textarea><br><button class=b onclick=chk(${i})>Check my code</button><div class=res id="cr${i}">Write the code and press Check.</div></div>`).join("")}
function ans(i,j){const d=Q[i][1],c=$("#q"+i);if(c.dataset.d)return;c.dataset.d=1;const bs=c.querySelectorAll(".opt");bs[j].classList.add(j==d[3]?"ok":"bad");bs[d[3]].classList.add("ok");c.querySelector(".why").textContent=(j==d[3]?"✅ Correct! ":"❌ Not quite. ")+d[4];if(j==d[3]){sc++;boom()}$("#score").textContent=`Score: ${sc} / ${Q.length}`}
function chk(i){const r=$("#cr"+i);try{const o=py($("#ch"+i).value).out.join("\n").trim();const ok=o==CH[i][3];r.textContent=ok?"✅ Correct! Output: "+o:"❌ Your output was “"+o+"”. Expected “"+CH[i][3]+"”.";r.className="res "+(ok?"ok":"bad")}catch(e){r.textContent="⚠ "+e.message;r.className="res bad"}}
// cinematic effects
const cv=$("#fx"),cx=cv.getContext("2d");let W,H,pt=[],cf=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
const SY=["if","elif","else",":","True","False",">=","==","and","or","print()"];
for(let i=0;i<26;i++)pt.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*.5+.2,t:SY[i%SY.length],z:12+Math.random()*16,a:Math.random()*6});
function boom(){const x=innerWidth/2,y=innerHeight*.45;for(let i=0;i<90;i++){const a=Math.random()*6.28,v=3+Math.random()*7;cf.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,c:["#ffb703","#5b3df5","#00a6c8","#10a860","#ff4d8d"][i%5],l:1,r:3+Math.random()*4})}}
function fr(){cx.clearRect(0,0,W,H);
pt.forEach(p=>{p.y-=p.s;p.a+=.01;if(p.y<-30){p.y=H+20;p.x=Math.random()*W}cx.globalAlpha=.14+.1*Math.sin(p.a);cx.fillStyle=dark?"#9aa3ff":"#5b3df5";cx.font=`bold ${p.z}px Consolas,monospace`;cx.fillText(p.t,p.x+Math.sin(p.a)*14,p.y)});
cf=cf.filter(c=>c.l>0);cf.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.22;c.vx*=.99;c.l-=.012;cx.globalAlpha=Math.max(c.l,0);cx.fillStyle=c.c;cx.fillRect(c.x,c.y,c.r,c.r*1.6)});
requestAnimationFrame(fr)}
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)fr();
// nav
const P=[["intro",S.intro.n],["if","if"],["ifelse","if-else"],["elif","if-elif-else"],["nested","Nested if"],["cmp","Compare"],["pg","Playground"],["sim","Simulator"],["prac","Practice"]];
function go(k){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==k));$("#m").innerHTML=S[k]?sec(k):k=="cmp"?cmp():k=="pg"?play2():k=="sim"?sims():prac();document.querySelectorAll("#m .card").forEach((c,i)=>c.style.animationDelay=Math.min(i,8)*70+"ms");scrollTo(0,0)}
$("#nav").innerHTML=P.map(p=>`<button data-k="${p[0]}" onclick="go('${p[0]}')">${p[1]}</button>`).join("");go("intro");
</script></body></html>
